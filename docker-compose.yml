services:
  # ── PostgreSQL (shared instance; separate freerouter + iamkit databases) ──
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: freerouter
      POSTGRES_PASSWORD: ${DB_PASSWORD:-freerouter}
      POSTGRES_DB: freerouter
      IAMKIT_DB_USER: iamkit
      IAMKIT_DB_PASSWORD: ${IAMKIT_DB_PASSWORD:-iamkit_secret}
      IAMKIT_DB_NAME: iamkit
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freerouter -d freerouter"]
      interval: 2s
      timeout: 3s
      retries: 20

  # ── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  # ── IAMKit ─────────────────────────────────────────────────────────
  # Built from source (IAMKIT_SRC, default ../iam) so the server matches the
  # SDK version pinned in go.mod. The workspace owner is created by
  # `make bootstrap` with the `iamkit bootstrap` CLI (credential written to a
  # private file, never to logs), so no IAMKIT_BOOTSTRAP_* variables here.
  iamkit:
    build:
      context: ${IAMKIT_SRC:-../iam}
    image: iamkit:freerouter-dev
    ports:
      - "127.0.0.1:${IAMKIT_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://iamkit:${IAMKIT_DB_PASSWORD:-iamkit_secret}@postgres:5432/iamkit?sslmode=disable
      SERVER_PORT: "8080"
      JWT_PRIVATE_KEY_PATH: /secrets/jwt.pem
      JWT_ISSUER: ${IAMKIT_JWT_ISSUER:-http://localhost:8080}
      OIDC_HMAC_SECRET: ${OIDC_HMAC_SECRET:?Set OIDC_HMAC_SECRET in .env (make setup)}
      IAMKIT_ENCRYPTION_KEY: ${IAMKIT_ENCRYPTION_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    volumes:
      - ./secrets/jwt.pem:/secrets/jwt.pem:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
