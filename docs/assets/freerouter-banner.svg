<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">FreeRouter — One gateway. Your providers. Your infrastructure.</title>
  <desc id="description">A midnight-blue and mint banner with a routing illustration connecting applications through FreeRouter to multiple model providers. An illustration, not a dashboard screenshot.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#25384c" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65e5b5"/>
      <stop offset="1" stop-color="#64b5ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" rx="20" fill="#0c1623"/>
  <rect width="1200" height="400" rx="20" fill="url(#grid)" opacity="0.4"/>
  <rect x="56" y="61" width="30" height="5" rx="2.5" fill="#65e5b5"/>
  <text x="100" y="68" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#a0b7cc">SELF-HOSTED LLM GATEWAY</text>
  <text x="51" y="184" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" letter-spacing="-3" fill="url(#accent)">FreeRouter</text>
  <text x="56" y="239" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#eef6ff">One gateway. Your infrastructure.</text>
  <text x="56" y="278" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#a0b7cc">Route models. Manage budgets. Keep control.</text>
  <text x="56" y="352" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#8ba6bf">MULTI-PROVIDER / MULTI-TENANT / PAY-PER-TOKEN</text>
  <g fill="none" stroke="#3b627d" stroke-width="2">
    <path d="M735 200H790"/>
    <path d="M936 200H966V91H996"/>
    <path d="M936 200H996"/>
    <path d="M936 200H966V309H996"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="620" y="170" width="115" height="60" rx="10" fill="#13263a" stroke="#3b627d"/>
    <text x="677" y="205" font-size="13" fill="#c6dbed">YOUR APP</text>
    <rect x="790" y="152" width="146" height="96" rx="14" fill="#12332f" stroke="#65e5b5" stroke-width="2"/>
    <text x="863" y="195" font-size="17" font-weight="700" fill="#86f1c8">FreeRouter</text>
    <text x="863" y="219" font-size="11" fill="#a0c9bd">ROUTE + METER</text>
    <rect x="996" y="64" width="150" height="54" rx="10" fill="#13263a" stroke="#3b627d"/>
    <text x="1071" y="96" font-size="14" fill="#c6dbed">OpenAI</text>
    <rect x="996" y="173" width="150" height="54" rx="10" fill="#13263a" stroke="#3b627d"/>
    <text x="1071" y="205" font-size="14" fill="#c6dbed">Anthropic</text>
    <rect x="996" y="282" width="150" height="54" rx="10" fill="#13263a" stroke="#3b627d"/>
    <text x="1071" y="314" font-size="14" fill="#c6dbed">More providers</text>
  </g>
  <circle cx="760" cy="200" r="4" fill="#65e5b5"/>
  <circle cx="966" cy="91" r="4" fill="#64b5ff"/>
  <circle cx="976" cy="200" r="4" fill="#65e5b5"/>
  <circle cx="966" cy="309" r="4" fill="#64b5ff"/>
</svg>
